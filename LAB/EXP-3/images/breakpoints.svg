<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Card layout at each breakpoint</title>
  <desc id="d">A desktop screen with four card columns, a tablet with two columns and a phone with one column.</desc>
  <rect width="1200" height="600" fill="#eef1f5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#333">
    <!-- desktop -->
    <rect x="40" y="70" width="560" height="360" rx="12" fill="#fff" stroke="#333" stroke-width="4"/>
    <rect x="40" y="70" width="560" height="40" rx="12" fill="#222"/>
    <rect x="40" y="96" width="560" height="14" fill="#222"/>
    <g fill="#c9d3e0">
      <rect x="66" y="140" width="113" height="150" rx="6"/><rect x="194" y="140" width="113" height="150" rx="6"/>
      <rect x="322" y="140" width="113" height="150" rx="6"/><rect x="450" y="140" width="113" height="150" rx="6"/>
    </g>
    <rect x="270" y="430" width="100" height="40" fill="#333"/><rect x="220" y="466" width="200" height="12" rx="4" fill="#333"/>
    <text x="320" y="530" font-size="30" font-weight="bold" text-anchor="middle">Wider than 1024px</text>
    <text x="320" y="568" font-size="26" text-anchor="middle">4 columns</text>
    <!-- tablet -->
    <rect x="660" y="110" width="260" height="340" rx="16" fill="#fff" stroke="#333" stroke-width="4"/>
    <rect x="676" y="130" width="228" height="26" fill="#222"/>
    <g fill="#c9d3e0">
      <rect x="676" y="170" width="106" height="110" rx="6"/><rect x="798" y="170" width="106" height="110" rx="6"/>
      <rect x="676" y="294" width="106" height="110" rx="6"/>
    </g>
    <text x="790" y="530" font-size="30" font-weight="bold" text-anchor="middle">481 to 768px</text>
    <text x="790" y="568" font-size="26" text-anchor="middle">2 columns</text>
    <!-- phone -->
    <rect x="990" y="150" width="160" height="300" rx="20" fill="#fff" stroke="#333" stroke-width="4"/>
    <rect x="1004" y="172" width="132" height="22" fill="#222"/>
    <g fill="#c9d3e0">
      <rect x="1004" y="204" width="132" height="64" rx="6"/><rect x="1004" y="278" width="132" height="64" rx="6"/>
      <rect x="1004" y="352" width="132" height="64" rx="6"/>
    </g>
    <text x="1070" y="530" font-size="30" font-weight="bold" text-anchor="middle">480px or less</text>
    <text x="1070" y="568" font-size="26" text-anchor="middle">1 column</text>
  </g>
</svg>
