# Experiment 13: mongod configuration with authentication turned on.
# Same keys as /etc/mongod.conf on Ubuntu (sheet section "Configuration and Security").
#
# The paths below are the Ubuntu defaults. For the test in the report, dbPath and the log
# path pointed to folders on the test machine; net and security were exactly as below.
# macOS (Homebrew, Apple silicon): dbPath /opt/homebrew/var/mongodb,
#   log /opt/homebrew/var/log/mongodb/mongo.log, this file is /opt/homebrew/etc/mongod.conf
# Windows: this file is C:\Program Files\MongoDB\Server\8.0\bin\mongod.cfg

storage:
  dbPath: /var/lib/mongodb

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

# Network settings
net:
  port: 27017
  bindIp: 127.0.0.1   # only this computer can connect. 0.0.0.0 would open it to the network

# Security
security:
  authorization: enabled
