exclude:
  # Theory/ holds server projects that cannot run on GitHub Pages.
  # From each Theory/Lecture-NN/<project>/ folder, only report.md (shown as
  # report.html) and the screenshots/ folder are published. The code stays on
  # GitHub only. These patterns also cover lecture folders you add later.
  #
  # In these patterns * also matches "/", so "Theory/Lecture-*.py" matches
  # every .py file at any depth inside every Lecture-NN folder.
  - "Theory/Lecture-*.py"
  - "Theory/Lecture-*.js"
  - "Theory/Lecture-*.ejs"
  - "Theory/Lecture-*.json"
  - "Theory/Lecture-*.txt"
  - "Theory/Lecture-*.css"
  - "Theory/Lecture-*/templates"
  - "Theory/Lecture-*/views"
  - "Theory/Lecture-*/static"
  - "Theory/Lecture-*/node_modules"
  - "Theory/Lecture-*/venv"
  - "Theory/Lecture-*/__pycache__"
  - "Theory/Lecture-*Pipfile*"
  - Theory/requirements.txt
  - node_modules/
  - "**/node_modules/"
  - "**/venv/"
  - "**/.venv/"
  - "**/__pycache__/"
