exclude:
  # Theory/ holds server projects that cannot run on GitHub Pages, so they are
  # not published. Only the assignments inside Theory/ are published:
  #   Theory/ASSIGNMENT_1_notes-app/   (live app + report)
  #   Theory/590017543-assignment2.md  (report)
  #
  # Every lecture folder is named Lecture-NN (Lecture-03, Lecture-05, ...),
  # so "Theory/Lecture-*" also covers lectures you add later.
  # The explicit folder lines below it are a backup for the pattern.
  - "Theory/Lecture-*"
  - Theory/Lecture-03/
  - Theory/Lecture-05/
  - Theory/Lecture-06/
  - Theory/Lecture-08/
  - Theory/requirements.txt
  - node_modules/
  - "**/node_modules/"
  - "**/venv/"
  - "**/.venv/"
  - "**/__pycache__/"
