<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | FastAPI SSR</title>
</head>
<body>
    <main>
        <h1>Students</h1>
        <p>Student details loaded from the FastAPI server.</p>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>SAP ID</th>
                    <th>Batch</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.sap_id }}</td>
                    <td>{{ student.batch }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3">No student details available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
